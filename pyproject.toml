[project]
name = "caretracking"
version = "0.1.0"
description = "AI care-tracking agent that monitors synthetic hospital data"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.13"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
caretracking = "caretracking.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["caretracking"]
